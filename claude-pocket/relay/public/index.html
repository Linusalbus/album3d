<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Claude Pocket</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  /* ChatGPT-like shell ------------------------------------------------ */
  :root{
    --bg:#ffffff; --side:#f9f9f9; --surface:#f4f4f4; --surface-2:#ececec; --line:#e5e5e5;
    --text:#0d0d0d; --muted:#6b6b6b; --primary:#0d0d0d; --on-primary:#ffffff;
    --ok:#10a37f; --warn:#d18a00; --bad:#e5484d; --code:#f7f7f8; --scrim:rgba(0,0,0,.35);
    /* iMessage */
    --ios-bg:#ffffff; --ios-blue:#007aff; --ios-in:#e9e9eb; --ios-in-text:#000; --ios-muted:#8e8e93;
    --ios-line:#d1d1d6; --ios-bar:rgba(249,249,249,.86); --ios-field:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#212121; --side:#171717; --surface:#2f2f2f; --surface-2:#3a3a3a; --line:#383838;
      --text:#ececec; --muted:#a3a3a3; --primary:#ececec; --on-primary:#0d0d0d;
      --ok:#19c37d; --warn:#f5a524; --bad:#ff6b6b; --code:#171717; --scrim:rgba(0,0,0,.55);
      --ios-bg:#000000; --ios-blue:#0a84ff; --ios-in:#26252a; --ios-in-text:#fff; --ios-muted:#8e8e93;
      --ios-line:#38383a; --ios-bar:rgba(22,22,24,.86); --ios-field:#1c1c1e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#212121; --side:#171717; --surface:#2f2f2f; --surface-2:#3a3a3a; --line:#383838;
    --text:#ececec; --muted:#a3a3a3; --primary:#ececec; --on-primary:#0d0d0d;
    --ok:#19c37d; --warn:#f5a524; --bad:#ff6b6b; --code:#171717; --scrim:rgba(0,0,0,.55);
    --ios-bg:#000000; --ios-blue:#0a84ff; --ios-in:#26252a; --ios-in-text:#fff; --ios-muted:#8e8e93;
    --ios-line:#38383a; --ios-bar:rgba(22,22,24,.86); --ios-field:#1c1c1e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:16px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       overscroll-behavior-y:contain}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer}
  svg{display:block}

  .top{position:sticky;top:0;z-index:20;background:var(--bg);
       padding:env(safe-area-inset-top) 8px 0;display:grid;grid-template-columns:48px 1fr auto;
       align-items:center;height:calc(56px + env(safe-area-inset-top))}
  .icon-btn{width:40px;height:40px;border-radius:10px;border:0;background:none;display:flex;
            align-items:center;justify-content:center;position:relative;color:var(--text)}
  .icon-btn:active{background:var(--surface)}
  .icon-btn svg{width:22px;height:22px}
  .top .title{font-weight:600;font-size:17px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
  .top .title small{display:block;font-weight:400;font-size:12px;color:var(--muted);line-height:1.2}
  .dotbadge{position:absolute;top:7px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--bad);
            border:2px solid var(--bg)}
  .away{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-right:8px}
  .switch{position:relative;width:42px;height:26px;border-radius:13px;background:var(--surface-2);
          border:0;padding:0;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
                 background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .switch[aria-checked="true"]{background:var(--ok)}
  .switch[aria-checked="true"]::after{transform:translateX(16px)}

  /* drawer */
  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--side);z-index:31;
          transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;
          padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
  body.drawer-open .drawer{transform:none}
  body.drawer-open .scrim{opacity:1;pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 14px;font-weight:600}
  .brand img{width:28px;height:28px;border-radius:8px}
  .nav-item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;
            padding:10px;border-radius:10px;font-size:15px;color:var(--text)}
  .nav-item svg{width:20px;height:20px;flex:none;opacity:.85}
  .nav-item.on,.nav-item:active{background:var(--surface-2)}
  .nav-item .count{margin-left:auto;font-size:12px;font-weight:600;background:var(--primary);color:var(--on-primary);
                   border-radius:10px;padding:1px 7px}
  .nav-head{font-size:12px;color:var(--muted);padding:18px 10px 6px;font-weight:500}
  .nav-scroll{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px}
  .nav-item .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin:0 6px}
  .sdot.working{background:var(--ok)} .sdot.waiting{background:var(--warn)} .sdot.ended{opacity:.35}
  .nav-item .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .drawer-foot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:13px;color:var(--muted);
               display:flex;align-items:center;gap:8px;padding-left:10px}
  .conn{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .conn.on{background:var(--ok)} .conn.off{background:var(--bad)}

  main{max-width:768px;margin:0 auto;padding:8px 16px calc(32px + env(safe-area-inset-bottom))}
  main.has-composer{padding-bottom:calc(120px + env(safe-area-inset-bottom))}

  /* generic blocks */
  .hero{text-align:center;padding:18vh 12px 0;color:var(--muted)}
  .hero h2{color:var(--text);font-size:24px;font-weight:600;margin:0 0 8px;letter-spacing:-.3px}
  .hero p{margin:0 auto;max-width:320px;font-size:15px}
  .section-title{font-size:13px;color:var(--muted);margin:22px 4px 8px;font-weight:500}
  .panel{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
  .panel h3{margin:0;font-size:16px;font-weight:600}
  .meta{color:var(--muted);font-size:13px}
  pre,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  pre{background:var(--code);border-radius:12px;padding:12px 14px;overflow:auto;white-space:pre-wrap;
      word-break:break-word;margin:10px 0;max-height:320px;border:1px solid var(--line)}
  :not(pre)>code{background:var(--surface-2);padding:1px 6px;border-radius:6px;font-size:.88em}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .btn{flex:1;min-width:0;background:var(--primary);color:var(--on-primary);border:0;border-radius:999px;
       padding:11px 16px;font-weight:500;font-size:15px;white-space:nowrap;text-align:center}
  .btn:disabled{opacity:.4}
  .btn.outline{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
  .field{margin-top:12px}
  .field > span{display:block;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
  textarea,input[type=text],input[type=password],select{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;
    padding:11px 14px;outline:none;resize:none}
  textarea:focus,input:focus,select:focus{border-color:var(--muted)}
  label.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);
            border-radius:14px;margin-top:8px;background:var(--bg)}
  label.opt:has(input:checked){border-color:var(--text)}
  label.opt input{margin-top:4px;accent-color:var(--primary)}
  label.opt small{display:block;color:var(--muted);font-size:13px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;
        background:var(--surface);color:var(--muted);white-space:nowrap}
  .pill .sdot{width:7px;height:7px;border-radius:50%;background:var(--muted)}

  /* AI chat transcript */
  .chat{display:flex;flex-direction:column;gap:18px;padding-top:8px}
  .turn-user{align-self:flex-end;background:var(--surface);border-radius:22px;padding:10px 16px;max-width:85%;
             overflow-wrap:anywhere}
  .turn-ai{overflow-wrap:anywhere}
  .turn-ai p,.turn-user p{margin:0 0 10px}.turn-ai p:last-child,.turn-user p:last-child{margin:0}
  .turn-tool{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin:-8px 0}
  .turn-tool svg{width:14px;height:14px;flex:none}
  .turn-tool span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}

  /* composer (shared by AI chat + Send) */
  .composer-wrap{position:fixed;left:0;right:0;bottom:0;z-index:15;background:linear-gradient(transparent,var(--bg) 30%);
                 padding:16px 12px calc(12px + env(safe-area-inset-bottom))}
  .composer{max-width:768px;margin:0 auto;background:var(--surface);border-radius:28px;padding:8px;
            border:1px solid var(--line);box-shadow:0 4px 20px rgba(0,0,0,.06)}
  .composer textarea{border:0;background:none;padding:6px 10px;max-height:160px;border-radius:0}
  .composer-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .round{width:36px;height:36px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex:none}
  .round svg{width:18px;height:18px}
  .round.plain{background:none;border:1px solid var(--line);color:var(--text)}
  .round.go{background:var(--primary);color:var(--on-primary)}
  .round.go:disabled{opacity:.3}
  .composer .hint{font-size:12px;color:var(--muted);flex:1;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

  .thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px}
  .thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface-2);
         flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);
         text-align:center;padding:4px;word-break:break-all}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;
                background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1;padding:0}

  /* usage */
  .meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:10px 0 8px}
  .meter i{display:block;height:100%;background:var(--primary);border-radius:4px}
  .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
  .stat{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .stat b{font-size:28px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);padding:4px;border-radius:999px}
  .seg button{background:none;border:0;padding:8px 6px;border-radius:999px;color:var(--muted);font-size:14px}
  .seg button.on{background:var(--bg);color:var(--text);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .file-row{display:flex;gap:12px;align-items:center;padding:10px 4px}
  .file-row img,.file-row .ph{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface);flex:none}
  .file-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow{flex:1;min-width:0}

  .toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translate(-50%,-8px);
         background:var(--primary);color:var(--on-primary);padding:9px 16px;border-radius:999px;font-size:14px;
         z-index:40;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* iMessage ---------------------------------------------------------- */
  body.ios{background:var(--ios-bg);
           font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,Arial,sans-serif}
  body.ios .top{background:var(--ios-bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
                border-bottom:.5px solid var(--ios-line)}
  body.ios .top .icon-btn{color:var(--ios-blue)}
  body.ios .top .icon-btn .dotbadge{border-color:transparent}
  body.ios main{max-width:none;padding:0}
  .ios-large{font-size:34px;font-weight:700;letter-spacing:.2px;padding:6px 16px 8px}
  .ios-list{list-style:none;margin:0;padding:0}
  .ios-row{display:flex;gap:12px;align-items:center;padding:10px 16px 10px 8px;position:relative}
  .ios-row:active{background:var(--ios-in)}
  .ios-row .unread{width:10px;height:10px;border-radius:50%;background:var(--ios-blue);flex:none}
  .ios-row .unread.no{background:transparent}
  .avatar{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
          background:linear-gradient(180deg,#a5abb8,#858994);color:#fff;font-weight:600;font-size:18px;letter-spacing:.5px}
  .ios-row .body{flex:1;min-width:0;padding-bottom:10px;margin-bottom:-10px;border-bottom:.5px solid var(--ios-line)}
  .ios-list li:last-child .body{border-bottom:0}
  .ios-row .line1{display:flex;align-items:baseline;gap:8px}
  .ios-row .name{font-weight:600;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ios-row .time{color:var(--ios-muted);font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:4px}
  .ios-row .preview{color:var(--ios-muted);font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;
                    -webkit-box-orient:vertical;overflow:hidden}
  .ios-head{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--text);line-height:1.2}
  .ios-head .avatar{width:32px;height:32px;font-size:13px}
  .thread{display:flex;flex-direction:column;padding:10px 12px 8px}
  .stamp{text-align:center;color:var(--ios-muted);font-size:11.5px;margin:14px 0 6px}
  .stamp b{font-weight:600}
  .bubble{max-width:75%;padding:7px 13px;border-radius:19px;font-size:17px;line-height:1.3;position:relative;
          overflow-wrap:anywhere;margin-top:2px;white-space:pre-wrap}
  .bubble.in{align-self:flex-start;background:var(--ios-in);color:var(--ios-in-text)}
  .bubble.out{align-self:flex-end;background:var(--ios-blue);color:#fff}
  .bubble a{color:inherit}
  .bubble.tail.in{border-bottom-left-radius:5px}
  .bubble.tail.out{border-bottom-right-radius:5px}
  .gap{height:8px}
  .linkcard{align-self:flex-start;max-width:75%;width:260px;border-radius:19px;overflow:hidden;background:var(--ios-in);
            color:var(--ios-in-text);text-decoration:none;margin-top:2px;display:block}
  .linkcard .lc-top{height:86px;display:flex;align-items:center;justify-content:center;
                    background:linear-gradient(135deg,rgba(127,127,127,.18),rgba(127,127,127,.06))}
  .linkcard .lc-top svg{width:34px;height:34px;opacity:.55}
  .linkcard .lc-body{padding:9px 13px 10px}
  .linkcard .lc-title{font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;
                      -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .linkcard .lc-host{color:var(--ios-muted);font-size:13px}
  .delivered{align-self:flex-end;color:var(--ios-muted);font-size:11.5px;margin:3px 4px 0}
  .ios-bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--ios-bar);
           -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
           padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px}
  .ios-field{flex:1;display:flex;align-items:flex-end;border:1px solid var(--ios-line);border-radius:20px;
             background:var(--ios-field);padding:3px 3px 3px 14px;min-height:36px}
  .ios-field textarea{border:0;background:none;padding:5px 0;font-size:17px;line-height:1.25;max-height:120px;border-radius:0}
  .ios-send{width:30px;height:30px;border-radius:50%;border:0;background:var(--ios-blue);color:#fff;flex:none;
            display:flex;align-items:center;justify-content:center;padding:0}
  .ios-send svg{width:16px;height:16px}
  .ios-send:disabled{opacity:0;pointer-events:none}
  .ios-empty{text-align:center;color:var(--ios-muted);padding:22vh 32px 0;font-size:15px}
  .ios-empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
  .ios-empty code{font-size:12px}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn" id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h16M4 16h10"/></svg>
    <span class="dotbadge" id="menuDot" hidden></span>
  </button>
  <div class="title" id="title">Claude Pocket</div>
  <div class="away" id="awayWrap" hidden>
    <span>Away</span>
    <button class="switch" id="away" role="switch" aria-checked="false" aria-label="Away mode"></button>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<main id="view"></main>
<div id="dock"></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
