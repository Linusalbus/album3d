<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<title>Claude Pocket</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --panel-2:#f0eee9; --line:#e2dfd8;
    --text:#1b1d22; --muted:#6c7280; --accent:#c96442; --accent-2:#b5583a; --on-accent:#fff;
    --ok:#2f8f5b; --warn:#b7791f; --bad:#c2413a; --code:#f3f1ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d0f13; --panel:#161a21; --panel-2:#1d222b; --line:#2a303b;
      --text:#e9edf4; --muted:#8d97a8; --accent:#d97757; --accent-2:#e58a6c; --on-accent:#fff;
      --ok:#4cc38a; --warn:#e0a743; --bad:#ff6b60; --code:#12151b;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0f13; --panel:#161a21; --panel-2:#1d222b; --line:#2a303b;
    --text:#e9edf4; --muted:#8d97a8; --accent:#d97757; --accent-2:#e58a6c; --on-accent:#fff;
    --ok:#4cc38a; --warn:#e0a743; --bad:#ff6b60; --code:#12151b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       overscroll-behavior-y:contain}
  button,input,textarea,select{font:inherit;color:inherit}
  header{position:sticky;top:0;z-index:5;background:var(--bg);
         padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:10px}
  header h1{margin:0;font-size:18px;letter-spacing:-.2px;flex:1;display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
  .away{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .switch{position:relative;width:44px;height:26px;border-radius:13px;background:var(--panel-2);
          border:1px solid var(--line);cursor:pointer;padding:0;transition:background .15s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
                 background:var(--muted);transition:transform .15s,background .15s}
  .switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
  .switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
      display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
  nav button{background:none;border:0;padding:10px 4px 12px;color:var(--muted);font-size:12px;cursor:pointer;
             display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  nav button svg{width:22px;height:22px}
  nav button.on{color:var(--accent);font-weight:600}
  .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--accent);color:var(--on-accent);
         font-size:10.5px;font-weight:700;border-radius:9px;min-width:18px;height:18px;padding:0 5px;
         display:flex;align-items:center;justify-content:center}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h3{margin:0 0 4px;font-size:16px}
  .sub{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:48px 16px}
  .empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
  pre,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
      overflow:auto;white-space:pre-wrap;word-break:break-word;margin:10px 0;max-height:320px}
  :not(pre)>code{background:var(--code);padding:1px 5px;border-radius:5px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{flex:1;min-width:0;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;
       padding:12px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn:active{background:var(--accent-2)}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);font-weight:500}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);font-weight:500}
  .pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--panel-2);
        color:var(--muted);border:1px solid var(--line);white-space:nowrap}
  .pill.working{color:var(--accent);border-color:var(--accent)}
  .pill.waiting{color:var(--warn);border-color:var(--warn)}
  textarea,input[type=text],input[type=password],select{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;outline:none;resize:vertical}
  textarea:focus,input:focus,select:focus{border-color:var(--accent)}
  label.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
            border-radius:10px;margin-top:8px;cursor:pointer;background:var(--panel-2)}
  label.opt input{margin-top:3px;accent-color:var(--accent)}
  label.opt small{display:block;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1;min-width:0}
  .list-item{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
  .list-item + .list-item{border-top:1px solid var(--line)}
  .list-item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .list{padding:0;overflow:hidden}
  .back{background:none;border:0;color:var(--accent);padding:0 0 12px;cursor:pointer;font-weight:600}
  .msgs{display:flex;flex-direction:column;gap:8px}
  .msg{padding:10px 12px;border-radius:14px;max-width:88%;word-wrap:break-word;overflow-wrap:anywhere}
  .msg p{margin:0 0 6px}.msg p:last-child{margin:0}
  .msg.user{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
  .msg.user :not(pre)>code{background:rgba(0,0,0,.15)}
  .msg.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.tool{align-self:flex-start;color:var(--muted);font-size:12.5px;padding:2px 4px;
            font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));margin-top:14px;
            background:var(--bg);padding-top:8px}
  .meter{height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin:8px 0 6px}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
  .meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
  .big{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
  .thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel-2);
         border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
         font-size:11px;color:var(--muted);text-align:center;padding:4px}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;
                background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
  .file-row{display:flex;gap:12px;align-items:center;padding:10px 0}
  .file-row + .file-row{border-top:1px solid var(--line)}
  .file-row img,.file-row .ph{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--panel-2);flex:none}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;
         z-index:10;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.show{opacity:1}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel-2);padding:4px;
       border-radius:10px;border:1px solid var(--line)}
  .seg button{background:none;border:0;padding:9px 6px;border-radius:7px;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .field{margin-top:12px}
  .field > span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>Claude Pocket</h1>
  <div class="away" id="awayWrap" hidden>
    <span>Away</span>
    <button class="switch" id="away" role="switch" aria-checked="false" aria-label="Away mode"></button>
  </div>
</header>
<main id="view"></main>
<nav id="nav" hidden>
  <button data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>Inbox<span class="badge" id="badge" hidden></span></button>
  <button data-tab="chats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Chats</button>
  <button data-tab="usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Usage</button>
  <button data-tab="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/><path d="M4 21h16"/></svg>Send</button>
</nav>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
